---
layout: default
title: about
---

{% assign about = site.data.about %}
<section id="about">
    <h4 id="typewriter" data-content="More about me"></h4>
    <div id="about-inner">
        <div id="about-info">
            <p>{{ about.description }} 
            <br><br>{{ about.line }}</p>
            <ul>
                {% for tech in about.technologies %}
                <li>{{ tech }}</li>
                {% endfor %}
            </ul>
        </div>
        <figure id="admin-pic">
            <img src="{{ about.image }}">
        </figure>
    </div>
</section>
